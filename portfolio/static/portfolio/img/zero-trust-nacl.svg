<svg width="100%" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#0d1117"/>

  <!-- ═══ EXTERNAL ZONE ═══ -->
  <rect x="5" y="10" width="133" height="310" rx="10" fill="#161b22" stroke="#444" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="71" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#666">External</text>

  <!-- Internet -->
  <rect x="14" y="36" width="115" height="48" rx="7" fill="#0a1628" stroke="#378ADD" stroke-width="1"/>
  <text x="71" y="56" text-anchor="middle" font-size="20">🌐</text>
  <text x="71" y="75" text-anchor="middle" font-size="9" font-weight="600" fill="#378ADD">Internet (via NAT GW)</text>

  <!-- VPC Peerings -->
  <rect x="14" y="96" width="115" height="110" rx="7" fill="#0a1628" stroke="#534AB7" stroke-width="1"/>
  <text x="71" y="113" text-anchor="middle" font-size="9" font-weight="700" fill="#AFA9EC">🔗 VPC Peerings</text>
  <text x="71" y="129" text-anchor="middle" font-size="8" fill="#666">App VPC (DEV)</text>
  <text x="71" y="143" text-anchor="middle" font-size="8" fill="#666">App VPC (QA / PROD)</text>
  <text x="71" y="157" text-anchor="middle" font-size="8" fill="#666">Shared Services VPC</text>
  <text x="71" y="171" text-anchor="middle" font-size="8" fill="#666">Platform VPC</text>
  <text x="71" y="185" text-anchor="middle" font-size="8" fill="#666">Payments VPC</text>
  <text x="71" y="199" text-anchor="middle" font-size="8" fill="#444">(direct peering — no Cloud WAN)</text>

  <!-- Dev VPN -->
  <rect x="14" y="218" width="115" height="44" rx="7" fill="#0a1628" stroke="#BA7517" stroke-width="1"/>
  <text x="71" y="235" text-anchor="middle" font-size="9" font-weight="700" fill="#E0A040">🔐 Dev VPN</text>
  <text x="71" y="252" text-anchor="middle" font-size="8" fill="#666">10.x.x.0/21</text>

  <!-- Arrow: External → VPC -->
  <line x1="129" y1="155" x2="152" y2="155" stroke="#555" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-gray)"/>
  <line x1="129" y1="60" x2="152" y2="60" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ═══ VPC CONTAINER ═══ -->
  <rect x="145" y="10" width="748" height="540" rx="14" fill="#0f1c2e" stroke="#185FA5" stroke-width="1.5"/>
  <text x="518" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#378ADD">internal-tooling-vpc  ·  10.x.0.0/16  ·  us-east-1  ·  18 subnets  ·  5 app groups</text>

  <!-- ═══ PUBLIC SUBNETS (Default NACL) ═══ -->
  <rect x="160" y="40" width="718" height="50" rx="8" fill="#0a2218" stroke="#1D9E75" stroke-width="1"/>
  <text x="370" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#5DCAA5">Public Subnets (NAT GW + IGW) — Default NACL: Rule 100 ALLOW ALL ✓</text>
  <text x="370" y="74" text-anchor="middle" font-size="8" fill="#3d7a5a">No app workloads here — Rule 90 DENY NOT applied (would break outbound internet for all app subnets)</text>
  <rect x="690" y="45" width="80" height="38" rx="5" fill="#0f3024" stroke="#1D9E75" stroke-width="1"/>
  <text x="730" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#5DCAA5">NAT GW</text>
  <text x="730" y="75" text-anchor="middle" font-size="8" fill="#3d7a5a">→ IGW → Internet</text>
  <rect x="778" y="45" width="78" height="38" rx="5" fill="#0f3024" stroke="#1D9E75" stroke-width="1"/>
  <text x="817" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#5DCAA5">IGW</text>
  <text x="817" y="75" text-anchor="middle" font-size="8" fill="#3d7a5a">public only</text>

  <!-- ═══ ROW 1 ═══ -->

  <!-- App Group A -->
  <rect x="160" y="102" width="335" height="108" rx="9" fill="#1a2520" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="160" y="102" width="335" height="24" rx="9" fill="#0a2218"/>
  <rect x="160" y="116" width="335" height="10" fill="#0a2218"/>
  <text x="178" y="118" font-size="10" font-weight="700" fill="#5DCAA5">App Group A  —  DB Layer</text>
  <text x="485" y="118" text-anchor="end" font-size="8" fill="#3d7a5a">/23 · 2 AZs</text>
  <!-- NACL badge -->
  <rect x="170" y="131" width="115" height="16" rx="4" fill="#0F6E56"/>
  <text x="227" y="143" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NACL-A  deny-by-default</text>
  <!-- Critical badge -->
  <rect x="293" y="131" width="192" height="16" rx="4" fill="#3d1a0a" stroke="#D85A30" stroke-width="0.8"/>
  <text x="389" y="143" text-anchor="middle" font-size="8" font-weight="700" fill="#F0997B">⚠  Receives :3306 from Group D  —  CRITICAL</text>
  <!-- Content -->
  <text x="170" y="162" font-size="8" fill="#777">Rules 10-80: ALLOW confirmed north-south flows (VPC Peerings, Dev VPN)</text>
  <text x="170" y="176" font-size="8" fill="#555">Rule 90: DENY 10.x.0.0/16  ·  Rule 100: ALLOW 0.0.0.0/0  ·  Rule *: DENY ALL</text>
  <text x="170" y="192" font-size="8" fill="#444">Future: migrate :3306 flow to VPC Lattice Service to eliminate direct DB exposure</text>

  <!-- App Group B — Hub -->
  <rect x="508" y="102" width="378" height="108" rx="9" fill="#0f1e30" stroke="#378ADD" stroke-width="1.5"/>
  <rect x="508" y="102" width="378" height="24" rx="9" fill="#0a1628"/>
  <rect x="508" y="116" width="378" height="10" fill="#0a1628"/>
  <text x="526" y="118" font-size="10" font-weight="700" fill="#378ADD">App Group B  —  Hub Service</text>
  <text x="876" y="118" text-anchor="end" font-size="8" fill="#185FA5">/23 · 2 AZs</text>
  <rect x="518" y="131" width="115" height="16" rx="4" fill="#185FA5"/>
  <text x="575" y="143" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NACL-B  deny-by-default</text>
  <text x="526" y="162" font-size="8" fill="#777">Rules 10-80: ALLOW → C (:443), D (:443), E (:443), powerup DEV/QA/PROD</text>
  <text x="526" y="176" font-size="8" fill="#555">Rule 90: DENY 10.x.0.0/16  ·  Rule 100: ALLOW 0.0.0.0/0  ·  Rule *: DENY ALL</text>
  <text x="526" y="192" font-size="8" fill="#444">Hub: all east-west flows originate here — primary inter-group communicator</text>

  <!-- ═══ ROW 2 ═══ -->

  <!-- App Group C — Provider API -->
  <rect x="160" y="222" width="335" height="95" rx="9" fill="#1a1a2e" stroke="#534AB7" stroke-width="1.5"/>
  <rect x="160" y="222" width="335" height="24" rx="9" fill="#13132e"/>
  <rect x="160" y="236" width="335" height="10" fill="#13132e"/>
  <text x="178" y="238" font-size="10" font-weight="700" fill="#AFA9EC">App Group C  —  API Provider</text>
  <text x="485" y="238" text-anchor="end" font-size="8" fill="#534AB7">/23 · 2 AZs</text>
  <rect x="170" y="251" width="115" height="16" rx="4" fill="#534AB7"/>
  <text x="227" y="263" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NACL-C  deny-by-default</text>
  <text x="170" y="281" font-size="8" fill="#777">Rules 10-80: ALLOW inbound from B, E + peered consumer VPCs</text>
  <text x="170" y="295" font-size="8" fill="#555">Rule 90: DENY 10.x.0.0/16  ·  Rule 100: ALLOW 0.0.0.0/0  ·  Rule *: DENY ALL</text>
  <text x="170" y="309" font-size="8" fill="#444">Provider pattern: only serves confirmed consumers — all others blocked by Rule 90</text>

  <!-- App Group D — Analytics (CRITICAL) -->
  <rect x="508" y="222" width="378" height="95" rx="9" fill="#2d1b0a" stroke="#D85A30" stroke-width="2"/>
  <rect x="508" y="222" width="378" height="24" rx="9" fill="#3d1a0a"/>
  <rect x="508" y="236" width="378" height="10" fill="#3d1a0a"/>
  <text x="526" y="238" font-size="10" font-weight="700" fill="#F0997B">App Group D  —  Analytics  ⚠</text>
  <text x="876" y="238" text-anchor="end" font-size="8" fill="#D85A30">/23 · 2 AZs</text>
  <rect x="518" y="251" width="115" height="16" rx="4" fill="#D85A30"/>
  <text x="575" y="263" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NACL-D  deny-by-default</text>
  <text x="526" y="281" font-size="8" fill="#cc7755">Rules 10-80: ALLOW → Group A :3306 (direct DB) · inbound from B :443</text>
  <text x="526" y="295" font-size="8" fill="#555">Rule 90: DENY 10.x.0.0/16  ·  Rule 100: ALLOW 0.0.0.0/0  ·  Rule *: DENY ALL</text>
  <text x="526" y="309" font-size="8" fill="#6a3520">Phase 1 baseline: explicit :3306 rule until VPC Lattice Service migration (Phase 2)</text>

  <!-- ═══ ROW 3 ═══ -->

  <!-- App Group E — Agents -->
  <rect x="160" y="329" width="335" height="95" rx="9" fill="#1e1a0a" stroke="#BA7517" stroke-width="1.5"/>
  <rect x="160" y="329" width="335" height="24" rx="9" fill="#2d2010"/>
  <rect x="160" y="343" width="335" height="10" fill="#2d2010"/>
  <text x="178" y="345" font-size="10" font-weight="700" fill="#E0A040">App Group E  —  Agents + Workflow</text>
  <text x="485" y="345" text-anchor="end" font-size="8" fill="#BA7517">/23 · 2 AZs</text>
  <rect x="170" y="358" width="115" height="16" rx="4" fill="#BA7517"/>
  <text x="227" y="370" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NACL-E  deny-by-default</text>
  <text x="170" y="388" font-size="8" fill="#777">Rules 10-80: ALLOW inbound from B :443 · outbound to C :443 · Dev VPN</text>
  <text x="170" y="402" font-size="8" fill="#555">Rule 90: DENY 10.x.0.0/16  ·  Rule 100: ALLOW 0.0.0.0/0  ·  Rule *: DENY ALL</text>
  <text x="170" y="416" font-size="8" fill="#666">Sub1 = Agents (AZ-a)  ·  Sub2 = Workflow (AZ-b) — intra-group allowed</text>

  <!-- Unoccupied Groups F/G/H -->
  <rect x="508" y="329" width="378" height="95" rx="9" fill="#111820" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="6 3"/>
  <rect x="508" y="329" width="378" height="24" rx="9" fill="#0d1117"/>
  <rect x="508" y="343" width="378" height="10" fill="#0d1117"/>
  <text x="526" y="345" font-size="10" font-weight="600" fill="#444">App Groups F, G, H  —  Unoccupied</text>
  <text x="526" y="370" font-size="8" fill="#333">10.x.18.0/23  ·  10.x.20.0/23  ·  10.x.22.0/23</text>
  <text x="526" y="385" font-size="8" fill="#333">251/251 IPs available — zero ENIs deployed</text>
  <text x="526" y="400" font-size="8" fill="#333">Placeholder NACLs applied — minimal rules until workloads identified</text>
  <text x="526" y="415" font-size="8" fill="#2a2a3a">Rules must be updated with confirmed CIDR pairs before Rule 90 cutover</text>

  <!-- ═══ EAST-WEST ARROWS (in gap between col1 x=495 and col2 x=508) ═══ -->

  <!-- B → D (:443, same column, row1→row2) -->
  <line x1="697" y1="210" x2="697" y2="222" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="706" y="219" font-size="8" fill="#1D9E75">:443</text>

  <!-- B → C (col2 row1 → col1 row2): left then down -->
  <polyline points="508,155 497,155 497,269 495,269" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="494" y="215" text-anchor="end" font-size="8" fill="#1D9E75">:443</text>

  <!-- B → E (col2 row1 → col1 row3): further left then down -->
  <polyline points="508,170 491,170 491,376 495,376" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="489" y="300" text-anchor="end" font-size="8" fill="#1D9E75">:443</text>

  <!-- D → A (:3306 CRITICAL, col2 row2 → col1 row1) -->
  <polyline points="508,265 484,265 484,156 495,156" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="7 3" marker-end="url(#arr-orange)"/>
  <text x="482" y="218" text-anchor="end" font-size="9" font-weight="700" fill="#D85A30">:3306</text>
  <!-- Warning pill -->
  <rect x="390" y="137" width="97" height="14" rx="4" fill="#3d1a0a" stroke="#D85A30" stroke-width="0.8"/>
  <text x="438" y="148" text-anchor="middle" font-size="7.5" font-weight="700" fill="#F0997B">⚠ DIRECT DB EXPOSURE</text>

  <!-- ═══ NACL RULE LEGEND ═══ -->
  <rect x="160" y="436" width="726" height="104" rx="8" fill="#0d1117" stroke="#1e2d3d" stroke-width="1"/>
  <text x="523" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#888">NACL Rule Convention — Applied Per App Group  (18 subnets / 5 custom NACLs)</text>

  <!-- Rule 10-80 -->
  <rect x="170" y="462" width="162" height="68" rx="6" fill="#0a2218" stroke="#1D9E75" stroke-width="1"/>
  <text x="251" y="478" text-anchor="middle" font-size="10" font-weight="700" fill="#5DCAA5">Rules 10–80  ✓</text>
  <text x="251" y="492" text-anchor="middle" font-size="8" fill="#888">Explicit ALLOW</text>
  <text x="251" y="505" text-anchor="middle" font-size="8" fill="#666">SG-evidence derived</text>
  <text x="251" y="518" text-anchor="middle" font-size="8" fill="#666">Both INBOUND + OUTBOUND</text>
  <text x="251" y="527" text-anchor="middle" font-size="7" fill="#3d7a5a">+ ephemeral returns :1024-65535</text>

  <!-- Rule 90 -->
  <rect x="342" y="462" width="162" height="68" rx="6" fill="#2d1b0a" stroke="#D85A30" stroke-width="1.5"/>
  <text x="423" y="478" text-anchor="middle" font-size="10" font-weight="700" fill="#F0997B">Rule 90  ★  CORE</text>
  <text x="423" y="492" text-anchor="middle" font-size="8" fill="#cc7755">DENY 10.x.0.0/16</text>
  <text x="423" y="505" text-anchor="middle" font-size="8" fill="#666">Blocks all intra-VPC</text>
  <text x="423" y="518" text-anchor="middle" font-size="8" fill="#666">traffic not in Rules 10-80</text>
  <text x="423" y="527" text-anchor="middle" font-size="7" fill="#6a3520">deny-by-default enforcement</text>

  <!-- Rule 100 -->
  <rect x="514" y="462" width="162" height="68" rx="6" fill="#0a1628" stroke="#378ADD" stroke-width="1"/>
  <text x="595" y="478" text-anchor="middle" font-size="10" font-weight="700" fill="#378ADD">Rule 100</text>
  <text x="595" y="492" text-anchor="middle" font-size="8" fill="#888">ALLOW 0.0.0.0/0</text>
  <text x="595" y="505" text-anchor="middle" font-size="8" fill="#666">Internet traffic</text>
  <text x="595" y="518" text-anchor="middle" font-size="8" fill="#666">Peering return traffic</text>
  <text x="595" y="527" text-anchor="middle" font-size="7" fill="#185FA5">ephemeral port returns</text>

  <!-- Rule * -->
  <rect x="686" y="462" width="188" height="68" rx="6" fill="#111820" stroke="#333" stroke-width="1"/>
  <text x="780" y="478" text-anchor="middle" font-size="10" font-weight="700" fill="#555">Rule *  (AWS Implicit)</text>
  <text x="780" y="492" text-anchor="middle" font-size="8" fill="#444">DENY ALL</text>
  <text x="780" y="505" text-anchor="middle" font-size="8" fill="#444">Cannot be removed</text>
  <text x="780" y="518" text-anchor="middle" font-size="8" fill="#444">Catches all unmatched</text>
  <text x="780" y="527" text-anchor="middle" font-size="7" fill="#333">final safety net</text>

</svg>
